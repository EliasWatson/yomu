<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f0">
<title>Yomu · 読む</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>読</text></svg>">
</head>
<body>
<header id="bar">
  <a href="#/" class="logo">読む <span>Yomu</span></a>
  <div class="bar-actions">
    <button id="btn-words" title="Saved words">★ <span id="word-count">0</span></button>
    <button id="btn-settings" title="Settings">Aa</button>
  </div>
</header>
<div id="settings" class="panel hidden">
  <label>Text size <input type="range" id="set-size" min="14" max="30" step="1"></label>
  <label><input type="checkbox" id="set-furi"> Furigana</label>
  <label>Theme <select id="set-theme"><option value="auto">Auto</option><option value="light">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select></label>
  <label><input type="checkbox" id="set-vert"> Vertical text (縦書き)</label>
</div>
<main id="app"></main>
<div id="popup" class="hidden" role="dialog"></div>
<footer id="credits">
  Dictionary: <a href="https://www.edrdg.org/wiki/index.php/JMdict-EDICT_Dictionary_Project" target="_blank" rel="noopener">JMdict</a> © <a href="https://www.edrdg.org/" target="_blank" rel="noopener">EDRDG</a>, used under <a href="https://www.edrdg.org/edrdg/licence.html" target="_blank" rel="noopener">CC BY-SA 4.0</a> (via jmdict-simplified).

  <a href="https://github.com/EliasWatson/yomu" target="_blank" rel="noopener">Source</a>
</footer>
<script src="/vendor/kuromoji.js"></script>
<script src="/app.js"></script>
</body>
</html>
